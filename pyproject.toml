[project]
name = "tapsi-food-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for Tapsi Food: search dishes and groceries, read menus and reviews, catch flash deals."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "tapsi", "tapsi-food", "iran", "food-delivery", "grocery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/NikanZeyaei/tapsi-food-mcp"
Issues = "https://github.com/NikanZeyaei/tapsi-food-mcp/issues"

[project.scripts]
tapsi-food-mcp = "tapsi_food_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real Tapsi Food API (run with -m live)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long Field(description=...) strings read better on one line
